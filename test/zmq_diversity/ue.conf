[rf]
freq_offset = 0
tx_gain = 80
rx_gain = 40
srate = 5.76e6
nof_antennas = 1
device_name = zmq
device_args = id=ue,base_srate=5.76e6,tx_port0=tcp://*:2101,rx_port0=tcp://localhost:2000

[rat.eutra]
dl_earfcn = 3350
nof_carriers = 1

[usim]
mode = soft
algo = xor
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 901700123456780
imei = 353490069873319

[rrc]
release = 8

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
netns =
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[log]
all_level = warning
phy_level = info
filename = ue.log
file_max_size = -1
