[enb]
enb_id = 0x19B
mcc = 901
mnc = 70
mme_addr = 127.0.0.1
gtp_bind_addr = 127.0.0.1
s1c_bind_addr = 127.0.0.1
s1c_bind_port = 0
n_prb = 25
nof_ports = 1
nof_rx_ant = 2
tm = 1

[enb_files]
sib_config = sib.conf
rr_config  = rr.conf
rb_config  = rb.conf

[rf]
dl_earfcn = 3350
tx_gain = 80
rx_gain = 40
device_name = zmq
device_args = id=enb,base_srate=5.76e6,tx_port0=tcp://*:2000,rx_port0=tcp://localhost:2201,rx_port1=tcp://localhost:2202

[log]
all_level = warning
phy_level = info
filename = enb.log
file_max_size = -1

[expert]
equalizer_mode = irc
nof_phy_threads = 2
metrics_csv_enable = false
rrc_inactivity_timer = 60000
